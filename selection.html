<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selection</title>
    <link rel="stylesheet" href="css/selection.css" type="text/css">
    <link rel="stylesheet" href="css/main.css" type="text/css">
</head>
<body>
    <main>
        <h1>Please select an option</h1>
        <div class="button-container">
<!--            for practice-->
            <div id="practice" onclick="redirect('practice')">
                <img src="assets/two-people-conversing-with-language-symbols-solid-icon-multilingual-communication-translation-and-language-exchange-silhouette-symbol-isolated-illustration-vector.jpg" alt="conversation">
                <p>Practice</p>
            </div>
<!--            for drilling-->
            <div onclick="redirect('drilling')" id="Drilling">
                <img src="assets/477-4770692_transparent-study-icon-png-studying-clipart-black-and.png" alt="study">
                <p>Drilling</p>
            </div>
        </div>
        <button onclick="window.location.href='index.html'">Go Back</button>
    </main>

    <script>
        //helping with the redirect function
        function redirect(id){
            if (id === "practice"){
                console.log("redirecting to practice");
                window.location.href = "practice.html";
                localStorage.setItem("area", "Practice")
            }
            else if (id === "drilling"){
                console.log("redirecting to drilling");
                window.location.href = "drilling.html";
                localStorage.setItem("area", "Drilling")
            }
        }

        //just clearing the area in the local storage
        console.log("removing: ",localStorage.getItem("area"));
        localStorage.removeItem("area");
    </script>
</body>
</html>
