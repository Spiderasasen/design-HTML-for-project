<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main Section</title>
    <link rel="stylesheet" href="css/main.css" type="text/css">
</head>
<body>
    <main class="main-section">
        <h1>Welcome to an AI tutor</h1>
        <div class="language-selection">
            <select id="language-select">
                <option value="">Please select a language</option>
                <option value="es">Spanish</option>
                <option value="ger">German</option>
                <option value="fr">French</option>
            </select>
        </div>
        <div class="language-level-selection" id="language-level-selection">
            <select id="language-level">
                <option value="">Please select a language level</option>
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>
        </div>
        <button id="continue-button">Continue</button>
    </main>
</body>

<script src="js/saving_language.js"></script>
<script>
    //removes the languages from the local storage from past sessions
    console.log(`removing ${localStorage.getItem("language")} from local storage`)
    console.log(`removing ${localStorage.getItem("language-level")} from local storage`)
    localStorage.removeItem("language");
    localStorage.removeItem("language-level");
</script>
</html>
